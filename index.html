## Three lessons out of this

--

- You don't know who your users are, you never will, you can try, but **don't assume** ;
- Ease of access (a simple **URL**, a **web browser**, **any** device) is very powerful ;
- Standards, things not breaking are not _nice to have_, they are **foundational** and **enabling**.

## Two ideas of what audio on the Web should be

.two-col[
.col[
### Mozilla: Audio Data API

- Humphrey &amp; al., Firefox 4 (2011)
- Raw samples, in and out of JavaScript
- Low level
- You write the DSP
]
.col[
### Google: Web Audio API

- Chris Rogers, Chrome 10 (2011)
- A graph of native processing nodes
- High level
- You wire the DSP
]
]

Then a third: the MediaStream Processing API (Robert O'Callahan, Mozilla, 2011), DSP in workers.

class: quote

> JavaScript is very much slower than heavily optimized C++ code and is not able to take advantage of SSE optimizations and multi-threading [...]. Optimized native code can be on the order of twenty times faster for processing FFTs as compared with JavaScript.

.attribution[Web Audio API, W3C First Public Working Draft, 15 December 2011, §15.4. Ed. Chris Rogers, Google.]

## How big is the Web slowdown?

The part of your code that you write runs as WebAssembly. Measured against native:

- **1.45–1.55×** on average, **2.1–2.5×** at worst, on SPEC CPU (Jangda et al., 2019)
- The 2011 spec said native was **20×** faster for FFTs

Let's take the worst reasonable case: **everything is twice as slow**.

.footnote[Jangda, Powers, Berger, Guha. "Not So Fast: Analyzing the Performance of WebAssembly vs. Native Code", USENIX ATC 2019. Firefox and Chrome, respectively.]

## Web Audio Modules: the Web-native answer

- A plugin is a JSON descriptor and an ES module, loaded from a URL
- `WamNode` is an `AudioNode`, `WamProcessor` is an `AudioWorkletProcessor`
- Parameters, state save/restore, MIDI, automation, transport, OSC events between plugins
- The GUI is a DOM element, usually a Web Component (accessible!)
- Groups sandbox plugins from each other, hosts can nest
- A community index, Faust and others exports WAM directly

--

<br>
<strong>In browser engineering circles, we'd say this is "very webby"</strong>

---

class: prose

.eyebrow[github.com/WebCLAP]

## WebCLAP: bring the native ABI to the Web

- A CLAP plugin (the native C ABI) compiled to wasm32
- Exports `clap_entry`, a function table, `malloc`; shared memory; optional WASI
- GUI through CLAP's webview extension: the plugin UI is HTML
- The same binary loads in a browser (AudioWorklet host) or in a native DAW (wclap-bridge, Wasmtime)

--

<br>
<strong>I don't have a saying, but this is very native-y and attractive for existing vendors</strong>

      let ircRun = 0;

      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function typeIrcReply(slide) {

        const typed = slide.querySelector('.irc-typed');
        slide.querySelectorAll('.irc-sent').forEach(line => line.remove());

          typed.textContent += ch;
          await sleep(35 + Math.random() * 35);

        await sleep(500);
        if (run !== ircRun) return;
        const nick = Object.assign(document.createElement('span'), { className: 'irc-nick me', textContent: 'padenot' });

        const line = Object.assign(document.createElement('div'), { className: 'irc-line irc-sent' });
        line.append(nick, msg);
        slide.append(line);
        typed.textContent = '';
      }
